# Pilotwardrobe web (Vue SPA) - nginx site config.
#
# Install:  sudo cp deploy/nginx/pilotwardrobe.conf /etc/nginx/sites-available/pilotwardrobe.conf
#           sudo ln -sfn /etc/nginx/sites-available/pilotwardrobe.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Releases are uploaded by .github/workflows/deploy-production.yml to
#   /var/www/apps/pilotwardrobe/frontend/releases/<sha>
# and `current` is switched atomically to the new release. The root below must
# match that workflow's DEPLOY_PATH.
#
# Traffic arrives through Cloudflare, which terminates TLS for visitors. This
# server block listens on 80 (Cloudflare SSL mode "Flexible"). For "Full
# (strict)", add a `listen 443 ssl` block with a Cloudflare Origin Certificate.

# One Cache-Control per request type (maps live in the http context, which
# sites-enabled/*.conf is included into). Setting it once at server level
# avoids nginx's add_header inheritance trap: any add_header inside a location
# would otherwise silently drop every server-level header (security headers too).
map $uri $pw_cache_control {
    # Vite's content-hashed build output: safe to cache forever.
    ~^/assets/                         "public, max-age=31536000, immutable";
    # Unhashed public files (favicon, brand images, manifest): cache, but revalidate.
    ~\.(?:ico|png|jpe?g|webp|avif|svg|webmanifest|txt)$  "public, max-age=86400, must-revalidate";
    # index.html and every SPA route: always revalidate so a deploy is picked up at once.
    default                            "no-cache";
}

server {
    listen 80;
    listen [::]:80;

    server_name pilotwardrobe.com www.pilotwardrobe.com;

    root /var/www/apps/pilotwardrobe/frontend/current;
    index index.html;

    # `current` is a symlink resolved on every request, so a deploy or rollback
    # takes effect immediately without reloading nginx. Don't enable a long
    # open_file_cache here: it would keep serving the previous release.

    charset utf-8;
    server_tokens off;

    # -- Headers (server level, inherited by every location below) -----------
    # No `always`: error responses (404s for stale asset URLs) must not be cached for a year.
    add_header Cache-Control $pw_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Report-only first: watch the browser console after deploy, then switch the
    # header name to Content-Security-Policy. Adjust hosts if the API, media or
    # payment SDK origins change.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://api.pilotwardrobe.com; font-src 'self' data:; connect-src 'self' https://api.pilotwardrobe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # -- Compression (Cloudflare also compresses; this covers direct hits) ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    # -- Routes ---------------------------------------------------------------
    # Hashed build output. A missing asset must 404, never fall back to
    # index.html (that would hand HTML to a <script> tag after a deploy).
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # Exact public files that must not fall back to the SPA.
    location = /favicon.ico   { try_files $uri =404; access_log off; log_not_found off; }
    location = /robots.txt    { try_files $uri =404; access_log off; log_not_found off; }
    location = /site.webmanifest {
        # Stock mime.types has no entry for .webmanifest.
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # Never serve dotfiles (.git, .env...) if one ever lands in a release.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Vue Router history mode: real files first, otherwise the app shell.
    # (No `$uri/`: directory probes would hit `index` and can return 403.)
    location / {
        try_files $uri /index.html;
    }

    access_log /var/log/nginx/pilotwardrobe-access.log;
    error_log  /var/log/nginx/pilotwardrobe-error.log warn;
}
