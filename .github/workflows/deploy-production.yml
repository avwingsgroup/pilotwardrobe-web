name: Deploy Pilotwardrobe Web App to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vue-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://pilotwardrobe.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: /var/www/my-vue-app
        run: |
          RELEASE="${GITHUB_SHA}"
          RELEASE_PATH="${DEPLOY_PATH}/releases/${RELEASE}"

          echo "Deploying release: ${RELEASE}"

          ssh \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${RELEASE_PATH}'"

          rsync \
            -az \
            --delete \
            -e "ssh -p ${VPS_PORT}" \
            dist/ \
            "${VPS_USER}@${VPS_HOST}:${RELEASE_PATH}/"

          ssh \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "ln -sfn '${RELEASE_PATH}' '${DEPLOY_PATH}/current'"

          echo "Deployment completed successfully."

      - name: Remove old releases
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: /var/www/my-vue-app
        run: |
          ssh \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '${DEPLOY_PATH}/releases' && \
             ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf"
